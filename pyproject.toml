[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "radar-laboral-crediticio"
version = "0.0.1"
description = "Radar Laboral-Crediticio del Perú: señales de vulnerabilidad del ingreso a partir de la EPEN (INEI)."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "duckdb>=1.1",
    "lightgbm>=4.5",
    "numpy>=2.0",
    "openpyxl>=3.1",
    "pandas>=2.2",
    "pydantic>=2.8",
    "pyreadstat>=1.2.7",
    "scikit-learn>=1.5",
]

[project.optional-dependencies]
# API y dashboard.
producto = [
    "fastapi>=0.115",
    "streamlit>=1.50",
    "uvicorn>=0.30",
]
# Notebook de desarrollo y validación del modelo.
notebooks = [
    "jupyter>=1.0",
    "matplotlib>=3.8",
    "nbconvert>=7.16",
]
dev = [
    "httpx>=0.27",
    "pytest>=8",
    "ruff>=0.6",
    "vl-convert-python>=1.6",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
radar = ["almacen/sql/**/*.sql", "almacen/semillas/*.csv"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
